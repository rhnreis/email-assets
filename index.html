<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Light</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .logo-wrapper {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    img {
      display: block;
      width: 100%;
      max-width: 400px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="logo-wrapper">
    <img src="logo_light.png" alt="Logo Light">
  </div>
</body>
</html>
